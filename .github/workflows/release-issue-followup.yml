name: Request issue testing after release

on:
  release:
    types: [published, edited]
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag to process
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to process (safe to rerun)
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: release-issue-followup-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  request-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        with:
          script: |
            const { followRelease } = require('./scripts/github-issue-automation.cjs');
            await followRelease({ github, context, core, tag: process.env.RELEASE_TAG });
