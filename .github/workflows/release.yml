name: Release ApexSenseBridge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify source version matches release tag
        shell: powershell
        run: |
          .\scripts\verify-version-consistency.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build Patched VIIPER
        shell: powershell
        run: |
          if (Test-Path scripts\build-viiper-windows.ps1) {
            .\scripts\build-viiper-windows.ps1
          }
          if (Test-Path scripts\build-libviiper-windows.ps1) {
            .\scripts\build-libviiper-windows.ps1
          }

      - name: Build Engine, Playnite Extension and Offline Installer
        shell: powershell
        env:
          ASB_SIGNING_CERTIFICATE_BASE64: ${{ secrets.ASB_SIGNING_CERTIFICATE_BASE64 }}
          ASB_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.ASB_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $buildParams = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:ASB_SIGNING_CERTIFICATE_BASE64)) {
            $buildParams["Sign"] = $true
          }
          .\scripts\build-installer.ps1 @buildParams

      - name: Test and verify release artifacts
        shell: powershell
        env:
          ASB_SIGNING_CERTIFICATE_BASE64: ${{ secrets.ASB_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          ctest --test-dir .\build-win -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyParams = @{ CheckArtifacts = $true }
          if (-not [string]::IsNullOrWhiteSpace($env:ASB_SIGNING_CERTIFICATE_BASE64)) {
            $verifyParams["RequireSignatures"] = $true
          }
          .\scripts\verify-version-consistency.ps1 @verifyParams

      - name: Extract Release Notes from CHANGELOG
        shell: powershell
        run: |
          $raw = Get-Content -LiteralPath "CHANGELOG.md" -Raw
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag) -and $env:GITHUB_REF -and $env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF.Substring("refs/tags/".Length)
          }
          $cleanTag = if (-not [string]::IsNullOrWhiteSpace($tag)) { $tag.Trim().TrimStart('v', 'V') } else { "" }
          $lines = $raw -split '\r?\n'
          $collecting = $false
          $extracted = @()
          if (-not [string]::IsNullOrWhiteSpace($cleanTag)) {
            $headerPattern = '(?m)^##\s+' + [regex]::Escape($cleanTag) + '(?:\s+.*)?$'
            foreach ($line in $lines) {
              if ($collecting) {
                if ($line -match '^##\s+') { break }
                $extracted += $line
              } elseif ($line -match $headerPattern) {
                $collecting = $true
              }
            }
          }
          if ($extracted.Count -eq 0) {
            foreach ($line in $lines) {
              if ($collecting) {
                if ($line -match '^##\s+') { break }
                $extracted += $line
              } elseif ($line -match '^##\s+') {
                $collecting = $true
              }
            }
          }
          $notes = ($extracted -join [Environment]::NewLine).Trim()
          [System.IO.File]::WriteAllText("dist/release-notes.md", $notes, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Extracted release notes ($($notes.Length) characters) to dist/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: dist/release-notes.md
          files: |
            dist/ApexSenseBridge-Setup.exe
            dist/ApexSenseBridge-Portable.zip
            dist/*.pext
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
