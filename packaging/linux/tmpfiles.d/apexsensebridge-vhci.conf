# usbip(8) attaches the device and then records the connection under here. The
# attach itself succeeds for an ordinary user once the sysfs attributes are
# group-writable, but the record does not, and usbip then exits non-zero with
# the device already attached - which reads as an attach failure and is what
# made the backend look like it needed root.
#
# The second line matters as much as the first: a port record left behind by an
# earlier run as root stays root-owned, and blocks the same user from rewriting
# it even when the directory itself is writable.
d /run/vhci_hcd 0770 root input -
R! /run/vhci_hcd/port* - - - - -
